# Build — CI gate for `standard` and `critical` tier projects.
#
# Runs `npm run build`. Catches type errors, missing imports, env var problems,
# and toolchain breakage that typecheck alone misses.
# See AGENTS.md → "Required CI Checks" for the tier definitions.
#
# If this project is `minimal` tier, delete this file — the typecheck + lint
# gates are sufficient.

name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    # Skip in the template repo itself — there's no Node project here, only
    # the workflow file to copy into downstream projects via sync-rules.sh.
    if: github.repository != 'thezpack/agency-rules-template'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          if npm run | grep -qE '^\s*build\s*$'; then
            npm run build
          else
            echo "::error::No 'build' script defined in package.json. Add one or remove this workflow (and downgrade the project tier in AGENTS.md if appropriate)."
            exit 1
          fi
